name: Cross-platform build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            system: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            system: linux-x64
          - name: macOS arm64
            os: macos-15
            system: macos-arm64
          - name: macOS x64
            os: macos-15-intel
            system: macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xorg-dev libglu1-mesa-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DQUBITCANVAS_STATIC_MSVC_RUNTIME=ON
          -DQUBITCANVAS_WINDOWS_GUI=ON
          -DCPACK_SYSTEM_NAME=${{ matrix.system }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install staging tree
        run: cmake --install build --config Release --prefix dist/QubitCanvas

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Upload staged application
        uses: actions/upload-artifact@v4
        with:
          name: QubitCanvas-${{ matrix.system }}-staging
          path: dist/QubitCanvas

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: QubitCanvas-${{ matrix.system }}-packages
          path: |
            build/QubitCanvas-*.zip
            build/QubitCanvas-*.tar.gz

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/QubitCanvas-*.zip
            build/QubitCanvas-*.tar.gz
